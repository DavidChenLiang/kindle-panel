name: panel

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "generate_panel_public.py"
      - ".github/workflows/panel.yml"

permissions:
  contents: write

concurrency:
  group: panel-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CJK fonts and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install --quiet Pillow

      - name: Generate panel
        run: python generate_panel_public.py

      - name: Commit updated panel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/panel.png
          if git diff --cached --quiet; then
            echo "面板无变化，跳过提交"
            exit 0
          fi
          # 定时任务和本机手动推图会并发写 main, 直接 push 会被判 non-fast-forward
          # (run 在 checkout 之后远端又前进了)。所以每次推送前先 fetch, 再把本地
          # 新图重新挂到远端 HEAD 之上, 保证永远 fast-forward, 不会产生 merge 冲突。
          for i in 1 2 3 4; do
            if ! git fetch --quiet origin main; then
              echo "fetch 失败, 第 $i 次重试"
              sleep 5
              continue
            fi
            git reset --soft origin/main || { echo "reset 失败, 第 $i 次重试"; sleep 5; continue; }
            git add docs/panel.png
            if git diff --cached --quiet; then
              echo "与远端一致，无需提交"
              exit 0
            fi
            git commit -q -m "chore: update panel $(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M)"
            if git push -q origin HEAD:main; then
              echo "pushed (attempt $i)"
              exit 0
            fi
            echo "push 冲突, 第 $i 次重试"
            sleep 5
          done
          echo "push 连续失败"
          exit 1
