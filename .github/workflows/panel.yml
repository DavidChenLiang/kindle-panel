name: panel

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "generate_panel_public.py"
      - ".github/workflows/panel.yml"

permissions:
  contents: write

concurrency:
  group: panel-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CJK fonts and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install --quiet Pillow

      - name: Generate panel
        run: python generate_panel_public.py

      - name: Commit updated panel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/panel.png
          if git diff --cached --quiet; then
            echo "面板无变化，跳过提交"
          else
            git commit -m "chore: update panel $(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M)"
            git push
          fi
